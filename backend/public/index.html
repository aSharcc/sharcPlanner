<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sharcPlanner</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
        <style></style>
        <meta name="google-site-verification" content="6HvogCqs5O354ZDTV4-cnyQCpc7ElHE2xXkqTIlq5A8" />
    </head>
    <body>
        <header class="container">
            <nav>
                <ul>
                    <li><h1>sharcPlanner !!</h1></li>
                </ul>
                <ul>
                    <li><a href="/api/auth/google" id="login-button" target="_self" role="button" class="outline">Connect to Google Calendar</a></li>
                </ul>
            </nav>
            <hr>
        </header> 
        <main class="container">
            <div id="flash-message" hidden style="border-left: 0.25rem solid; padding: 1rem; border-radius: var(--pico-border-radius); margin-bottom: var(--pico-spacing);"></div>

            <fieldset> <!--Switch for selecting which form to use-->
                <label for="ai-switch">
                    <input id="ai-switch" role="switch" type="checkbox"> 
                    AI Mode 
                </label>
            </fieldset> 
            <details>
                <summary id="theme-title">Weekly Theme !!</summary>
                <div id="weekly-theme" style="padding-bottom: 1rem;"> 
                    <p id="theme-description"></p>
                    <button id="use-theme" class="outline">Use the Theme in AI Mode</button>
                </div>
            </details>

            <div id="results-div" hidden>
                <h3>Generated Items</h3>
                <ul id="generated-results"></ul>
            </div>
            
            <form id="manual-form"> <!--Manual form (shown by default)-->
                <label for="manual-summary">
                    Title
                    <input id="manual-summary" name="manual-summary" type="text" required>
                </label>
                <label for="manual-description">   
                    Description
                    <textarea id="manual-description" name="manual-description"></textarea>
                </label>
                <div class="grid">
                    <label for="manual-start-date"> 
                        Start Date
                        <input type="date" id="manual-start-date" name="manual-start-date" required>
                    </label>
                    <label for="manual-start-time">
                        Start Time
                        <input type="time" value="00:00" id="manual-start-time" name="manual-start-time">
                    </label>
                </div>
                <div class="grid">
                    <label for="manual-end-date">
                        End Date
                        <input type="date" id="manual-end-date" name="manual-end-date" required>
                    </label>
                    <label for="manual-end-time">
                        End Time
                        <input type="time" value="00:00" id="manual-end-time" name="manual-end-time">
                    </label>
                </div>
                <button type="submit">Add Event</button>
            </form>

            <form id="ai-form" hidden> <!--AI form (hidden by default)-->
                    <label for="ai-goal">
                        Goal
                        <input id="ai-goal" name="ai-goal" type="text" required>
                    </label>
                    <label for="ai-time">
                        Time (Hours)
                        <input id="ai-time" name="ai-time" type="number" min="0.1" step="any" required>
                    </label>
                <div class="grid">
                    <label for="ai-deadline-date">
                        Deadline Date
                        <input type="date" id="ai-deadline-date" name="ai-deadline-date" required>
                    </label>
                    <label for="ai-deadline-time">
                        Deadline Time
                        <input type="time" value="00:00" id="ai-deadline-time" name="ai-deadline-time">
                    </label>
                </div>
                <button type="submit">Generate Schedule</button>
            </form>

            <details>
                <summary>User Feedback</summary>
                <form id="feedback-form">
                    <label for="feedback-message">
                        Feedback Message
                        <textarea id="feedback-message" name="message"></textarea>
                    </label>
                    <button type="submit">Submit Feedback</button>
                </form>
            </details>

            <footer>
                <a href="/privacy.html" target="_blank" >Privacy Policy / TOS / README</a>
            </footer>

            <script>
                const aiSwitch = document.getElementById("ai-switch");
                const manualForm = document.getElementById("manual-form");
                const aiForm = document.getElementById("ai-form");
                const flashBox = document.getElementById("flash-message");
                let flashTimeout = null;
                const loginButton = document.getElementById("login-button"); 
                const today = new Date();
                const resultsList = document.getElementById("generated-results");
                const resultsDiv = document.getElementById("results-div");

                function updateFormVisability() {
                    const isAI = aiSwitch.checked;
                    manualForm.hidden = isAI;
                    aiForm.hidden = !isAI;
                    flashBox.hidden = true;
                }

                function showFlash(message, type) {
                    if (flashTimeout) clearTimeout(flashTimeout);
                    flashBox.innerText = message;
                    flashBox.hidden = false;

                    if (type === "bad") { 
                        flashBox.style.borderLeftColor = "red";
                    } else if (type === "good") {
                        flashBox.style.borderLeftColor = "green";
                    }

                    flashTimeout = setTimeout(() => {
                        flashBox.hidden = true;
                    }, 4000);
                }
                
                async function updateLoginStatus() {
                    try {
                        const response = await fetch("/api/auth/status");
                        const data = await response.json();
                        if (data.isAuthenticated === true) {
                            loginButton.innerText = "Log Out";
                            loginButton.style.borderColor = "green";
                            loginButton.href = "/api/auth/logout";
                        } else {
                            loginButton.innerText = "Connect to Google Calendar";
                            loginButton.style.borderColor = "red";
                            loginButton.href = "/api/auth/google";
                            
                        }
                    } catch (error) {
                        console.log("Could not get login status: ", error);
                    }
                }

                async function fetchWeeklyTheme() {
                    try {
                        const response = await fetch("/api/themes/current");
                        const theme = await response.json();

                        if (theme && theme.title && theme.description) {
                            document.getElementById("theme-title").textContent = "Weekly Theme: " + theme.title + "      (Click me)";
                            document.getElementById("theme-description").textContent = theme.description;

                            document.getElementById("use-theme").addEventListener("click", () => {
                                aiSwitch.checked = true;
                                updateFormVisability();
                                document.getElementById("ai-goal").value = theme.description;
                                document.getElementById("ai-time").value = theme.suggested_hours || 1;
                                
                                const startDate = new Date(theme.start_date);
                                startDate.setDate(startDate.getDate() + 7);
                                document.getElementById("ai-deadline-date").value = startDate.toISOString().split("T")[0];
                            });
                        } else {
                            document.getElementById("weekly-theme").hidden = true;
                        }
                    } catch (error) {
                        console.log("Could not get weekly theme: ", error);
                    }
                } 

                updateLoginStatus();
                updateFormVisability();
                aiSwitch.addEventListener("change", updateFormVisability); 
                fetchWeeklyTheme();
                resultsDiv.hidden = true;


                document.querySelectorAll("input[type=date]").forEach(element => {
                    element.value = today.toLocaleDateString('sv-SE');
                    element.min = today.toISOString().split("T")[0];
                });

                document.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const form = event.target; 
                    const formData = new FormData(form);
                    const data = Object.fromEntries(formData);
                    const button = form.querySelector("button[type=submit]");
                    const originalText = button.innerText;

                    try {
                        if (form.id === "manual-form") {
                            if (!data["manual-summary"] || !data["manual-start-date"] || !data["manual-end-date"]) {
                                showFlash("Please fill all fields", "bad");
                                return;
                            }

                            const startISO = new Date(`${data["manual-start-date"]}T${data["manual-start-time"] || "00:00"}`);
                            const endISO = new Date(`${data["manual-end-date"]}T${data["manual-end-time"] || "00:00"}`);

                            if (startISO.getTime() > endISO.getTime()) {
                                showFlash("End date must be after start date", "bad");
                                return;
                            }
                            

                            const payload = {
                                summary: data["manual-summary"],
                                description: data["manual-description"],
                                startISO: startISO.toISOString(),
                                endISO: endISO.toISOString(),
                            };

                            button.disabled = true;
                            button.innerText = "Creating event...";

                            const response = await fetch("/api/calendar/add-event", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload)
                            });

                            const result = await response.json()
 
                            if (response.ok) {
                                console.log("Manual event added successfully"); 
                                form.reset();
                                showFlash("Yippie event created", "good");
                                resultsList.innerHTML = "";
                                let resultsHTML = "";
                                resultsHTML += (`<li><strong>${result.event.summary}: </strong><a href="${result.event.htmlLink}">Link</a><br>
                                                    <strong>Start: </strong>${result.event.start.dateTime}<br>
                                                    <strong>End: </strong>${result.event.end.dateTime}</li>`);
                                resultsList.innerHTML = resultsHTML;
                                resultsDiv.hidden = false;
                            } else {
                                console.log("Manual event failed: ", response.status);
                                if (response.status === 401) {
                                    showFlash("Please log in first !!", "bad");
                                    return;
                                }
                                showFlash(`Failed to create event (Status: ${response.status})`, "bad");
                            }
                        } else if (form.id === "ai-form") {
                            if (!data["ai-goal"] || !data["ai-deadline-date"] || !data["ai-time"]) {
                                showFlash("Please fill all fields", "bad");
                                return;
                            }

                            const deadline = new Date(`${data["ai-deadline-date"]}T${data["ai-deadline-time"] || "00:00"}`);

                            if (deadline.getTime() < today.getTime()) {
                                showFlash("Deadline must be in the future", "bad");
                                return;
                            }
                            

                            const payload = {
                                goal: data["ai-goal"],
                                time: Number(data["ai-time"]),
                                deadline: deadline.toISOString(), 
                            };

                            button.disabled = true;
                            button.innerText = "Generating Schedule....";
                            
                            const response = await fetch("/api/ai/generate-events", { 
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload) 
                            });

                            const result = await response.json();

                            if (response.ok) {
                                if (result.schedule.length === 0) {
                                    showFlash("No results created", "bad");
                                    return;  
                                }
                                console.log("ai plan added successfully", result);  
                                form.reset();
                                showFlash("Yippie ai plan created", "good"); 
                                resultsList.innerHTML = "";
                                let resultsHTML = "";
                                for (event of result.schedule) { resultsHTML += (`<li><strong>${event.summary}: </strong><a href="${event.link}">Link</a><br>
                                                    <strong>Start: </strong>${new Date(event.start.dateTime).toLocaleString([], { timeStyle: "short", dateStyle: "medium" })}<br>
                                                    <strong>End: </strong>${new Date(event.end.dateTime).toLocaleString([], { timeStyle: "short", dateStyle: "medium" })}</li>`);}
                                resultsList.innerHTML = resultsHTML;
                                resultsDiv.hidden = false;
                            } else {
                                console.log("AI plan failed: ", response.status);
                                if (response.status === 401) {
                                    showFlash("Please log in first !!", "bad");
                                    return; 
                                }
                                if (response.status === 429) {
                                    const errorData = await response.json();
                                    showFlash(errorData.error, "bad");
                                    return;
                                }
                                showFlash(`Failed to create ai plan (Status: ${response.status})`, "bad");
                            }
                        } else if (form.id === "feedback-form") {
                            const message = data.message;
                            const response = await fetch("/api/feedback", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ message }) 
                            });

                            if (response.ok) {
                                console.log("feedback submitted successfully");
                                form.reset();
                                showFlash("Yippie feedback submitted successfully", "good");
                            } else {
                                console.log("feedback submission failed: ", response.status);
                                if (response.status === 401) {
                                    showFlash("Please log in first !!", "bad");
                                    return;
                                }
                                showFlash(`Failed to submit feedback (Status: ${response.status})`, "bad");
                            }
                        }
                    } catch (error) {
                        console.error("sumbission error: ", error);
                        showFlash(`:c error: ${error}`, "bad"); 
                    } finally {
                        button.disabled = false;
                        button.innerText = originalText;
                    }
                });
            </script>
        </main> 
    </body>
</html>
