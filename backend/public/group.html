<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sharcPlanner - Group Event</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
    </head>
    <body>
        <header class="container">
            <nav>
                <ul>
                    <li><h1 id="home-heading">sharcPlanner !!</h1></li>
                </ul>
                <ul>
                    <li id="user-info"></li>
                    <li><a href="/api/auth/google" id="login-button" target="_self" role="button" class="outline">Connect to Google</a></li>
                </ul>
            </nav>
            <hr>
        </header>

        <main class="container">
            <div id="flash-message" hidden style="border-left: 0.25rem solid; padding: 1rem; border-radius: var(--pico-border-radius); margin-bottom: var(--pico-spacing);"></div>
            <div id="user-timezone"></div>
            <div id="event-info" hidden></div>
            <div id="Closed" hidden><h4>Event closed with no selected slot :c</h4></div>
            <div id="Finalised" hidden></div>
            <div id="Open" hidden>
                <h3>Submit Availability</h3>
                <form id="availability-form">
                    <label for="availability-name">
                        Name
                        <input name="availability-name" id="availability-name" required>
                    </label>
                    <div class="grid">
                        <label for="availability-slot-1-start">
                            Availability Slot 1 Start
                            <input type="datetime-local" name="availability-slot-1-start" id="availability-slot-1-start" required>
                        </label>
                        <label for="availability-slot-1-end">
                            Availability Slot 1 End
                            <input type="datetime-local" name="availability-slot-1-end" id="availability-slot-1-end" required>
                        </label>
                    </div>
                    <div id="dynamic-slots"></div>
                    <button type="button" id="add-slot">Add another slot</button>
                    <button type="submit">Submit Availability</button>
                </form>
            </div>

            <!--Footer Stuff-->
            <footer>
                <a href="/privacy.html" target="_blank" >Privacy Policy / TOS / README</a>
            </footer>
        </main>
        
        <script>
            const homeHeading = document.getElementById("home-heading");
            const infoDiv = document.getElementById("event-info");
            const timezoneDiv = document.getElementById("user-timezone");
            const openDiv = document.getElementById("Open");
            const finalisedDiv = document.getElementById("Finalised");
            const closedDiv = document.getElementById("Closed");
            const addAvailabilitySlot = document.getElementById("add-slot");
            const dynamicInputs = document.getElementById("dynamic-slots");
            const flashBox = document.getElementById("flash-message");

            const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const id = new URLSearchParams(window.location.search).get("id");
            let slotCount = 1;
            let flashTimeout = null;
            let minDate;
            let maxDate;

            function showFlash(message, type) {
                if (flashTimeout) clearTimeout(flashTimeout);
                flashBox.innerText = message;
                flashBox.hidden = false;

                if (type === "bad") { 
                    flashBox.style.borderLeftColor = "red";
                } else if (type === "good") {
                    flashBox.style.borderLeftColor = "green";
                }

                flashTimeout = setTimeout(() => {
                    flashBox.hidden = true;
                }, 4000);
            }

            function escapeHTML(str) {
                if (typeof str !== "string") {
                        return "";
                    }
                return str.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
            }

            async function getEvent() {
                if (!id) {
                    showFlash("No group event id given", "bad");
                    return;
                }
                try {
                    const response = await fetch(`/api/group/${id}`);
                    const result = await response.json();
                    if (response.status === 404) {
                        showFlash("No group events found for that ID", "bad");
                        return;
                    }
                    if (response.status === 400) {
                        showFlash("Invalid event ID", "bad");
                        return;
                    }
                    if (response.status === 500) {
                        showFlash(`${result.error}`, "bad");
                        return;
                    }

                    const range_end = new Date(result.range_end);
                    const range_start = new Date(result.range_start);
                    const startStr = range_start.toLocaleString("sv-SE", { timeZone: userTimeZone, year: "numeric", month: "2-digit", day: "2-digit", hour:"2-digit", minute: "2-digit", second: "2-digit", hour12: false}).replace(" ", "T");
                    const nowStr = new Date().toLocaleString("sv-SE", { timeZone: userTimeZone, year: "numeric", month: "2-digit", day: "2-digit", hour:"2-digit", minute: "2-digit", second: "2-digit", hour12: false}).replace(" ", "T");

                    minDate = startStr > nowStr ? startStr : nowStr;
                    maxDate = range_end.toLocaleString("sv-SE", { timeZone: userTimeZone, year: "numeric", month: "2-digit", day: "2-digit", hour:"2-digit", minute: "2-digit", second: "2-digit", hour12: false}).replace(" ", "T");

                    document.getElementById("availability-slot-1-start").min = minDate;
                    document.getElementById("availability-slot-1-end").min = minDate;

                    document.getElementById("availability-slot-1-start").max = maxDate;
                    document.getElementById("availability-slot-1-end").max = maxDate;

                    if (result.finalised === true) {
                        finalisedDiv.innerHTML = `<hr><h3>Event Slot Finalised !!</h3><p><strong>Chosen Slot: ${new Date(result.finalised_slot.startISO).toLocaleString("sv-SE", {timeZone: userTimeZone})} to ${new Date(result.finalised_slot.endISO).toLocaleString("sv-SE", {timeZone: userTimeZone})}</strong></p>`
                        const calendarAddBtn = document.createElement("button");
                        calendarAddBtn.innerText = "Add to Google Calendar";

                        calendarAddBtn.addEventListener("click", async () => {
                            try {
                                calendarAddBtn.disabled = true;
                                calendarAddBtn.innerText = "Adding to calendar..."
                                const response = await fetch(`/api/group/${id}/calendar-sync`, {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ timeZone: userTimeZone })
                                });
                                const result = await response.json();
                                if (response.status === 429) {
                                    showFlash(`${result.error}`, "bad");
                                    return;
                                }
                                if (!response.ok) {
                                    showFlash(`${response.status}: ${result.error}`, "bad");
                                    return;
                                } else {
                                    showFlash(`Event added to google calendar successfully !!`, "good");
                                    finalisedDiv.removeChild(calendarAddBtn);
                                    const newText = document.createElement("p");
                                    newText.innerHTML = `<h3>Added to calendar !!</h3><p><strong>${escapeHTML(result.event.summary)}: </strong><a href="${escapeHTML(result.link)}">Link</a><br>
                                                    <strong>Start: </strong>${new Date(result.event.start.dateTime).toLocaleString([], { timeStyle: "short", dateStyle: "medium", timeZone: userTimeZone })}<br>
                                                    <strong>End: </strong>${new Date(result.event.end.dateTime).toLocaleString([], { timeStyle: "short", dateStyle: "medium", timeZone: userTimeZone })}</p>`;
                                    finalisedDiv.appendChild(newText);
                                }
                            } catch (error) {
                                showFlash(`Error adding event to Google Calendar: ${error}`, "bad")
                            } finally {
                                calendarAddBtn.disabled = false;
                                calendarAddBtn.innerText = "Add to Google Calendar";
                            }
                        });
                        finalisedDiv.appendChild(calendarAddBtn);
                        finalisedDiv.appendChild(document.createElement("hr"));
                        finalisedDiv.hidden = false;
                    } else if (range_end.getTime() < (new Date()).getTime()) {
                        closedDiv.hidden = false;
                        return;
                    } else {
                        openDiv.hidden = false;
                    }
                    infoDiv.innerHTML = `<h4>${escapeHTML(result.title)}</h4><p>${escapeHTML(result.description)}</p><p>${result.duration} hours</p><p>${new Date(range_start).toLocaleString("sv-SE", {timeZone: userTimeZone})} to ${new Date(range_end).toLocaleString("sv-SE", {timeZone: userTimeZone})}</p>`;
                    infoDiv.hidden = false;
                } catch (error) {
                    console.error("Error fetching group event: ", error);
                    showFlash("failed to get group event details, please reload to try again", "bad")
                }
            }

            homeHeading.addEventListener("click", () => {
                window.location.href = "/";
            });
            addAvailabilitySlot.addEventListener("click", () => {
                if (slotCount >= 100) {
                    return;
                }
                slotCount++;
                const newRow = document.createElement("div");
                newRow.className = "grid";

                const newLabelStart = document.createElement("label");
                newLabelStart.setAttribute("for", `availability-slot-${slotCount}-start`);
                newLabelStart.textContent = `Availability Slot ${slotCount} Start`;

                const newInputStart = document.createElement("input");
                newInputStart.name = `availability-slot-${slotCount}-start`;
                newInputStart.id = `availability-slot-${slotCount}-start`;
                newInputStart.type = "datetime-local";
                newInputStart.min = minDate;
                newInputStart.max = maxDate;
                

                newLabelStart.appendChild(newInputStart);
                newRow.appendChild(newLabelStart);

                const newLabelEnd = document.createElement("label");
                newLabelEnd.setAttribute("for", `availability-slot-${slotCount}-end`);
                newLabelEnd.textContent = `Availability Slot ${slotCount} End`;

                const newInputEnd = document.createElement("input");
                newInputEnd.name = `availability-slot-${slotCount}-end`;
                newInputEnd.id = `availability-slot-${slotCount}-end`;
                newInputEnd.type = "datetime-local";
                newInputEnd.min = minDate;
                newInputEnd.max = maxDate;
                

                newLabelEnd.appendChild(newInputEnd);
                newRow.appendChild(newLabelEnd);

                const newDeleteButton = document.createElement("button");
                newDeleteButton.id = `availability-slot-${slotCount}-delete`;
                newDeleteButton.type = "button";
                newDeleteButton.innerText = "Delete Slot"

                newRow.appendChild(newDeleteButton);

                dynamicInputs.appendChild(newRow);

                newDeleteButton.addEventListener("click", () => {
                    dynamicInputs.removeChild(newRow);
                });
            });

            document.addEventListener("submit", async (event) => {
                event.preventDefault();

                    const form = event.target; 
                    const formData = new FormData(form);
                    const data = Object.fromEntries(formData);
                    const button = form.querySelector("button[type=submit]");
                    const originalText = button.innerText;

                    try {
                        if (form.id === "availability-form") { 
                            button.disabled = true;
                            if (!data["availability-name"]) { 
                                showFlash("Please fill in name", "bad");
                                return;
                            }
                            let validSlots = [];
                            for (let slot = 1; slot <= slotCount; slot++) {
                                if (!data[`availability-slot-${slot}-start`] || !data[`availability-slot-${slot}-end`]) {
                                    console.log("missing slot date for", slot);
                                    continue;
                                }
                                const slotStart = new Date(data[`availability-slot-${slot}-start`]);
                                const slotEnd = new Date(data[`availability-slot-${slot}-end`]);

                                if (isNaN(slotStart) || isNaN(slotEnd)) {
                                    console.log("invalid slot date for", slot);
                                    continue;
                                }

                                if (slotStart.getTime() >= slotEnd.getTime()) {
                                    showFlash("at least 1 slot failed due to invalid times", "bad");
                                    continue;
                                }

                                validSlots.push({ startISO: slotStart.toISOString(), endISO: slotEnd.toISOString() });
                            }

                            if (validSlots.length === 0) {
                                showFlash("No valid slots provided", "bad");
                                return;
                            }

                            const payload = {
                                participant_name: data["availability-name"],
                                available_slots: validSlots
                            };

                            const response = await fetch(`/api/group/${id}/submit`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload)
                            });

                            const result = await response.json();

                            if (response.status === 400) {
                                showFlash(`${result.error}`, "bad")
                                return;
                            }
                            if (response.status === 410) {
                                showFlash(`${result.error}`, "bad")
                                return;
                            }
                            if (response.status === 500) {
                                showFlash(`${result.error}`, "bad")
                                return;
                            }
                            if (response.status === 404) {
                                showFlash(`${result.error}`, "bad")
                                return;
                            }
                            if (response.status === 429) {
                                showFlash(`${result.error}`, "bad");
                                return;
                            }
                            if (response.ok) {
                                form.reset();
                                showFlash("availability submitted successfully !!", "good");
                                form.hidden = true;
                            }
                        }
                    } catch (error) {
                        console.error("sumbission error: ", error);
                        showFlash(`:c error: ${error}`, "bad"); 
                    } finally {
                        button.disabled = false;
                        button.innerText = originalText;
                    }
            });

            // Initial stuffs
            timezoneDiv.innerHTML = `<p><strong>This will be using the timezone ${userTimeZone}</strong> (this should be ur timezone, pls tell me if this is wrong)</p><hr>`;
            getEvent();
            
        </script>
    </body>
</html>
